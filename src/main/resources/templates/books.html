<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content}, 'Danh Sach Sach')}">
<th:block th:fragment="content">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-3">Danh Sach Sach</h2>
            <a th:href="@{/books/add}" class="btn btn-primary btn-sm mb-3">Them Sach Moi</a>

            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Tieu De</th>
                        <th>Tac Gia</th>
                        <th class="text-center">Hanh Dong</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}"></td>
                        <td th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td class="text-center">
                            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning btn-sm">Sua</a>
                            <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Ban co chac muon xoa sach nay?');">Xoa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="4" class="text-center text-muted">Chua co sach nao.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</html>
